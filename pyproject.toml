[project]
name = "mastermag"
version = "0.1.0"
description = ""
authors = [
    {name = "satanisz",email = "staniszprzemyslaw@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scipy (>=1.16.1,<2.0.0)",
    "matplotlib (>=3.10.6,<4.0.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pyomo (>=6.9.4,<7.0.0)",
    "gekko (>=1.3.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "mastermag", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
